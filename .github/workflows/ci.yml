name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Resolve dependencies
        run: uv lock
      - name: Install
        run: uv sync --all-extras
      - name: Compile
        run: uv run python -m compileall -q autoup tests
      - name: Ruff
        run: uv run ruff check autoup tests
      - name: Tests
        run: uv run pytest -q --cov=autoup --cov-report=term-missing --cov-report=xml
      - name: Commit generated lockfile
        if: success() && github.event_name == 'push' && github.ref_name == 'refactor/phase1-5-cleanup'
        run: |
          git add uv.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: lock dependencies"
            git push
          fi
      - name: Upload lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: uv sync --all-extras
      - name: Smoke tests
        run: uv run pytest -q tests/test_smoke.py tests/test_config.py tests/test_utils.py
